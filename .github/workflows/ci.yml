name: Automated API Tests

# 1. When should this run?
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  run-tests:
    name: Run Vitest Suite
    runs-on: ubuntu-latest # This is the temporary cloud server

    steps:
      # Step A: Download your code from the repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step B: Install Node.js on the server
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Step C: Install all your packages (Express, Vitest, Supertest, etc.)
      - name: Install Dependencies
        run: npm install

      # Step D: Run your automated tests!
      - name: Execute Tests
        run: npx vitest run