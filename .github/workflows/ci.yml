name: Automated API Tests

# 1. When should this run?
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  run-tests:
    name: Run Vitest Suite
    runs-on: ubuntu-latest 

    defaults:
      run:
        working-directory:./backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      # Step D: Run your automated tests!
      - name: Execute Tests
        run: npx vitest run